[package]
name = "musetalk-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "musetalk-bench"
path = "src/main.rs"

[dependencies]
hanzo-ml = { path = "../ml/hanzo-ml" }
hanzo-nn = { path = "../ml/hanzo-nn" }
hanzo-quant = { path = "../engine/hanzo-quant" }
half = "2"
serde = { version = "1", features = ["derive"] }

[features]
cuda = ["hanzo-ml/cuda", "hanzo-nn/cuda", "hanzo-quant/cuda"]
cudnn = ["cuda", "hanzo-ml/cudnn", "hanzo-nn/cudnn"]
metal = ["hanzo-ml/metal", "hanzo-nn/metal", "hanzo-quant/metal"]
accelerate = ["hanzo-ml/accelerate", "hanzo-nn/accelerate", "hanzo-quant/accelerate"]

[profile.release]
opt-level = 3
